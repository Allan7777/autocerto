<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoCerto IA</title><style>body{font:16px system-ui;background:#10243a;color:white;max-width:760px;margin:30px auto;padding:16px}textarea,select{width:100%;padding:12px;box-sizing:border-box;margin:8px 0;background:#07182a;color:white;border:1px solid #5784a2;border-radius:8px}textarea{height:160px}button{background:#47b5f2;border:0;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;font:inherit}a{color:#8cdbff}</style><a href="./index.html">← Voltar ao Copilot</a><h1>Analisar problema com IA</h1><p>Não informe nomes, CPF, placas, senhas ou outros dados confidenciais.</p><label>Módulo</label><select id="mod"><option>Todos</option><option>Administrativo</option><option>Avaliação de Veículos</option><option>Gestor de Leads</option><option>Financeiro</option><option>Integrações</option></select><label>Problema do cliente</label><textarea id="q" maxlength="1500" placeholder="Descreva o problema..."></textarea><button id="go">Analisar com IA</button><p id="status"></p><pre id="answer"></pre><button id="copy" hidden>Copiar resposta</button><script>const $=x=>document.getElementById(x);$("go").onclick=async()=>{const question=$("q").value.trim();if(question.length<8){$("status").textContent="Descreva o problema com mais detalhes.";return}const token=localStorage.getItem("autocertoDeviceTokenV1");if(!token){$("status").textContent="Este dispositivo precisa de autorização do administrador.";return}$("go").disabled=true;$("status").textContent="Analisando...";try{const r=await fetch("https://lpyggrfqfigrvfcosnaj.supabase.co/functions/v1/copilot-ai",{method:"POST",headers:{"content-type":"application/json","x-device-token":token},body:JSON.stringify({question,module:$("mod").value,cases:[]})});const j=await r.json();if(!r.ok)throw Error(j.error||"Erro na IA");$("answer").textContent=j.answer;$("copy").hidden=false;$("status").textContent="Análise concluída. Revise antes de enviar."}catch(e){$("status").textContent=e.message}finally{$("go").disabled=false}};$("copy").onclick=()=>navigator.clipboard.writeText($("answer").textContent);</script>
